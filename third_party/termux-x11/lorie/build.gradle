import org.gradle.api.artifacts.ProjectDependency

apply plugin: 'com.android.library'
apply from: 'version.gradle'

rootProject.subprojects.each { p -> if (p != project) project.evaluationDependsOn(p.path) }

// The application module that actually ships this library, found by real
// dependency relationship rather than "has the application plugin" (e.g.
// shell-loader also applies com.android.application, but isn't our host).
def hostProjects = rootProject.subprojects.findAll { p ->
    p != project && p.plugins.hasPlugin('com.android.application') &&
    p.configurations.findByName('implementation')?.dependencies?.any {
        it instanceof ProjectDependency && it.path == project.path
    }
}
if (hostProjects.isEmpty())
    throw new GradleException("No application module depends on :${project.name}; cannot determine APPLICATION_ID")
if (hostProjects.size() > 1)
    throw new GradleException("Multiple application modules depend on :${project.name} (${hostProjects.collect { it.path }}); cannot determine which one is the real host")
def hostProject = hostProjects[0]
def hostApplicationId = hostProject.android.defaultConfig.applicationId ?: hostProject.android.namespace
// ndkVersion isn't inherited from the host module; use its value when set,
// otherwise fall back to a known 16 KB-page-aligning NDK.
def hostNdkVersion = hostProject.android.ndkVersion ?: "29.0.14206865"
def hedgeyosCompileSdkVersion = rootProject.hasProperty("compileSdkVersion") ? rootProject.properties.compileSdkVersion.toInteger() : 34

android {
    namespace 'com.termux.x11'
    //noinspection GrDeprecatedAPIUsage
    compileSdkVersion hedgeyosCompileSdkVersion
    ndkVersion hostNdkVersion
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34
        buildConfigField "String", "VERSION_NAME", "\"${termuxX11VersionName}\""
        buildConfigField "String", "COMMIT", "\"" + ("git rev-parse HEAD\n".execute().getText().trim() ?: (System.getenv('CURRENT_COMMIT') ?: "NO_COMMIT")) + "\""
        buildConfigField "String", "APPLICATION_ID", "\"${hostApplicationId}\""

        consumerProguardFiles 'proguard-rules.pro'
    }

    compileOptions.sourceCompatibility JavaVersion.VERSION_1_9
    compileOptions.targetCompatibility JavaVersion.VERSION_1_9
    externalNativeBuild.cmake.path "src/main/cpp/CMakeLists.txt"
    packagingOptions.jniLibs.useLegacyPackaging false
    buildFeatures.aidl true
    buildFeatures.buildConfig true
    sourceSets {
        main {
            java.srcDir "$buildDir/generated/java"
            res.srcDir "$buildDir/generated/templateRes"
        }
    }
}

dependencies {
    //noinspection DifferentStdlibGradleVersion

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.10"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.preference:preference:1.2.1'
    compileOnly project(':x11-shell-loader-stub')
}
afterEvaluate {
    def generatedJavaDir = file("$buildDir/generated/java")
    def generatedPrefsFile = file("$buildDir/generated/java/com/termux/x11/Prefs.java")
    def generatedShortcutsFile = file("$buildDir/generated/templateRes/xml/shortcuts.xml")

    def generatePrefsTask = tasks.register("generatePrefs") {
        inputs.file file('src/main/res/xml/preferences.xml')
        outputs.file generatedPrefsFile

        doLast {
            //noinspection UnnecessaryQualifiedReference
            def xml = groovy.xml.DOMBuilder.parse((new StringReader(file('src/main/res/xml/preferences.xml').text)))
            def preferenceNodes = xml.documentElement.getElementsByTagName("*")
            def preferences = []

            for (int i = 0; i < preferenceNodes.length; i++) {
                def node = preferenceNodes.item(i)
                if (node.nodeName == 'EditTextPreference' && node.getAttribute("app:key") != "extra_keys_config")
                    preferences << [ type: 'String',  key: node.getAttribute("app:key"), default: node.getAttribute("app:defaultValue") ]
                else if (node.nodeName == 'SeekBarPreference')
                    preferences << [ type: 'Int', key: node.getAttribute("app:key"), default: node.getAttribute("app:defaultValue") ]
                else if (node.nodeName == 'ListPreference') {
                    def entries = node.getAttribute("app:entries")
                    def values = node.getAttribute("app:entryValues")
                    preferences << [type: 'List', key: node.getAttribute("app:key"), default: node.getAttribute("app:defaultValue"),
                                    entries: entries.substring(7, entries.length()), values: values.substring(7, values.length())]
                }
                else if (node.nodeName == 'SwitchPreferenceCompat')
                    preferences << [ type: 'Boolean',  key: node.getAttribute("app:key"), default: node.getAttribute("app:defaultValue") ]
            }

            generatedPrefsFile.getParentFile().exists() || generatedPrefsFile.getParentFile().mkdirs()
            generatedPrefsFile.delete()
            generatedPrefsFile.createNewFile()

            generatedPrefsFile << 'package com.termux.x11;\n'
            generatedPrefsFile << 'import java.util.HashMap;\n'
            generatedPrefsFile << 'import android.content.Context;\n'
            generatedPrefsFile << 'import com.termux.x11.utils.TermuxX11ExtraKeys;\n'
            generatedPrefsFile << '\n'
            generatedPrefsFile << 'public class Prefs extends LoriePreferences.PrefsProto {\n'
            preferences.each {
                if (it.type == 'Int' || it.type == 'Boolean')
                    generatedPrefsFile << "  public final ${it.type}Preference ${it.key} = new ${it.type}Preference(\"${it.key}\", ${it.default});\n"
                else if (it.type == 'String')
                    generatedPrefsFile << "  public final StringPreference ${it.key} = new StringPreference(\"${it.key}\", \"${it.default}\");\n"
                else if (it.type == 'List')
                    generatedPrefsFile << "  public final ${it.type}Preference ${it.key} = new ${it.type}Preference(\"${it.key}\", \"${it.default}\", R.array.${it.entries}, R.array.${it.values});\n"
            }
            generatedPrefsFile << '  public final StringPreference extra_keys_config = new StringPreference("extra_keys_config", TermuxX11ExtraKeys.DEFAULT_IVALUE_EXTRA_KEYS);\n'
            generatedPrefsFile << '  public final HashMap<String, Preference> keys = new HashMap<>() {{\n'
            preferences.each { generatedPrefsFile << '    put("' + it.key + '", ' + it.key + ');\n' }
            generatedPrefsFile << '    put("extra_keys_config", extra_keys_config);\n'
            generatedPrefsFile << '  }};\n'
            generatedPrefsFile << '\n'
            generatedPrefsFile << '  public Prefs(Context ctx) {\n'
            generatedPrefsFile << '    super(ctx);\n'
            generatedPrefsFile << '  }\n'
            generatedPrefsFile << '}\n'
        }
    }
    preBuild.dependsOn generatePrefsTask

    def generateShortcutsTask = tasks.register("generateShortcuts") {
        inputs.file file('src/main/templates/xml/shortcuts.xml')
        outputs.file generatedShortcutsFile

        doLast {
            generatedShortcutsFile.getParentFile().exists() || generatedShortcutsFile.getParentFile().mkdirs()
            generatedShortcutsFile.text = file('src/main/templates/xml/shortcuts.xml').text
                    .replace('@@APPLICATION_ID@@', hostApplicationId)
        }
    }
    preBuild.dependsOn generateShortcutsTask

    android.libraryVariants.all { variant ->
        def variantName = variant.name.capitalize()
        tasks.named("compile${variantName}JavaWithJavac").configure {
            dependsOn generatePrefsTask
            source generatedJavaDir
        }
    }
}
