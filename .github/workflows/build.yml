name: Build hedgeyos

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Install rootfs build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mmdebstrap zstd qemu-user-static binfmt-support ca-certificates curl bison shellcheck

      - name: Lint HedgeyOS shell scripts
        run: |
          shellcheck \
            rootfs/build-rootfs.sh \
            rootfs/finalize-rootfs.sh \
            rootfs/configure-rootfs.sh \
            rootfs/verify-gtk-svg.sh \
            rootfs/verify-migration-packages.sh \
            rootfs/runtime-assets/hedgeyos-linux/hedgeyos-runtime-preflight \
            rootfs/runtime-assets/hedgeyos-linux/hedgeyos-session-init \
            scripts/test-linux-runtime.sh \
            scripts/test-linux-migrations.sh \
            scripts/test-runtime-containment.sh \
            scripts/test-proot-seqpacket-reproducer.sh \
            scripts/test-proot-payload.sh

      - name: Run Linux runtime safety tests
        run: |
          ./scripts/test-linux-defaults.sh
          ./scripts/test-linux-runtime.sh
          ./scripts/test-linux-migrations.sh
          ./scripts/test-runtime-containment.sh
          ./scripts/test-proot-seqpacket-reproducer.sh
          ./scripts/test-proot-payload.sh

      - name: Fetch Debian archive keyring
        run: |
          mkdir -p build/debian-keyring
          curl -fsSL \
            https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb \
            -o build/debian-keyring.deb
          echo "9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac  build/debian-keyring.deb" |
            sha256sum -c -
          dpkg-deb -x build/debian-keyring.deb build/debian-keyring

      - name: Build Debian rootfs
        run: |
          sudo env \
            OUT_DIR="$PWD/build/rootfs" \
            DEBIAN_KEYRING="$PWD/build/debian-keyring/usr/share/keyrings/debian-archive-keyring.gpg" \
            ./rootfs/build-rootfs.sh
          sudo chown -R "$USER:$USER" build rootfs/manifests
          mkdir -p app/src/main/assets
          cp build/rootfs/debian-trixie-arm64-rootfs.tar.zst app/src/main/assets/
          cp rootfs/manifests/debian-trixie-arm64-rootfs.tar.zst.sha256 app/src/main/assets/

      - name: Inspect Debian rootfs customizations
        run: |
          ./scripts/inspect-hedgeyos-rootfs.sh \
            build/rootfs/debian-trixie-arm64-rootfs.tar.zst \
            rootfs/manifests/debian-trixie-arm64-rootfs.provenance \
            build/hedgeyos-rootfs-inspection

      - name: Verify pinned PRoot payload
        run: |
          ./scripts/test-proot-payload.sh

      - name: Build unsigned ARM64 APK
        env:
          HEDGEYOS_USE_EXTERNAL_NATIVE_BUILD: "1"
          HEDGEYOS_INCLUDE_X11_MODULE: "1"
          HEDGEYOS_X11_DEBUG: "0"
          HEDGEYOS_SIGN_RELEASE: "0"
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          ./scripts/build-hedgeyos.sh

      - name: Verify outputs
        run: |
          test -f app/build/outputs/apk/release/hedgeyos-arm64-v8a.apk
          test -f app/build/outputs/apk/release/hedgeyos-arm64-v8a.apk.sha256
          cd app/build/outputs/apk/release
          sha256sum -c hedgeyos-arm64-v8a.apk.sha256

      - name: Inspect APK structure
        run: |
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt" \
            ./scripts/inspect-hedgeyos-apk.sh \
            app/build/outputs/apk/release/hedgeyos-arm64-v8a.apk \
            build/hedgeyos-inspection \
            rootfs/manifests/debian-trixie-arm64-rootfs.provenance

      - name: Upload APK inspection artifact
        uses: actions/upload-artifact@v7
        with:
          name: hedgeyos-apk-inspection
          path: build/hedgeyos-inspection/**
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hedgeyos-arm64-v8a-ci
          path: |
            app/build/outputs/apk/release/hedgeyos-arm64-v8a.apk
            app/build/outputs/apk/release/hedgeyos-arm64-v8a.apk.sha256
            rootfs/manifests/**
            build/hedgeyos-rootfs-inspection/**
            build/hedgeyos-logs/**
            build/hedgeyos-inspection/**
          if-no-files-found: error
